<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم إلى نسمة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f4f7f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #2e7d32; margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #2e7d32; box-shadow: 0 0 5px rgba(46,125,50,0.2); }
        button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .footer-link { margin-top: 20px; font-size: 0.85rem; }
        .footer-link a { color: #2e7d32; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/logo.png" alt="نسمة" width="80" onerror="this.style.display='none'">
        <h2>إنشاء حساب جديد</h2>
        <p>انضم إلينا لطلب خدمات التنظيف بكل سهولة</p>
        <form method="POST">
            <input type="text" name="name" placeholder="الاسم الكامل" required>
            <input type="tel" name="phone" placeholder="رقم الهاتف (مثل: 079...)" required>
            <input type="password" name="password" placeholder="كلمة السر" required>
            <button type="submit">إنشاء الحساب</button>
        </form>
        <div class="footer-link">
            لديك حساب بالفعل؟ <a href="{{ url_for('login') }}">تسجيل الدخول</a>
        </div>
    </div>
</body>
</html>
