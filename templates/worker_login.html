<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول نسمة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { background-color: #121212; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { background: #1e1e1e; padding: 30px; border-radius: 20px; border: 1px solid #d4af37; width: 100%; max-width: 400px; }
        .btn-gold { background: #d4af37; color: black; font-weight: bold; width: 100%; border-radius: 10px; }
        /* تنسيق رسالة الخطأ */
        .alert-error { background: rgba(220, 53, 69, 0.2); color: #ff6b6b; padding: 10px; border-radius: 10px; border: 1px solid rgba(220, 53, 69, 0.3); margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 style="color: #d4af37;">نسمة ✨</h2>
        <p>تسجيل دخول العاملات</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-error">⚠️ {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="اسم المستخدم" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required>
            <button type="submit" class="btn btn-gold">دخول</button>
        </form>
    </div>
</body>
</html>
