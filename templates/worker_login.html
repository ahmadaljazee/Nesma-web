<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول عاملات {{ company.name }} | نسمة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        
        body { 
            background-color: #121212; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            font-family: 'Cairo', sans-serif;
        }
        
        .login-card { 
            background: #1e1e1e; 
            padding: 40px 30px; 
            border-radius: 25px; 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        
        .gold-brand { color: #d4af37; font-weight: 900; font-size: 2.5rem; margin-bottom: 5px; }
        .company-subtitle { color: #ffffff; opacity: 0.7; font-size: 1rem; margin-bottom: 30px; }
        
        .form-control {
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .form-control:focus {
            background: #333;
            border-color: #d4af37;
            color: white;
            box-shadow: none;
        }

        .btn-gold { 
            background: #d4af37; 
            color: black; 
            font-weight: bold; 
            width: 100%; 
            border-radius: 12px; 
            padding: 12px;
            font-size: 1.1rem;
            border: none;
            transition: 0.3s;
        }
        
        .btn-gold:hover { 
            background: #f4e095; 
            transform: translateY(-2px);
        }

        .alert-error { 
            background: rgba(220, 53, 69, 0.15); 
            color: #ff6b6b; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid rgba(220, 53, 69, 0.2); 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h1 class="gold-brand">نسمة</h1>
        <p class="company-subtitle">لوحة عاملات: <b>{{ company.name }}</b></p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-error">⚠️ {{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="worker_name" class="form-control" placeholder="اسم العاملة" required autocomplete="username">
            <input type="password" name="password" class="form-control" placeholder="كلمة المرور" required autocomplete="current-password">
            <button type="submit" class="btn btn-gold">دخول للمهام 🚀</button>
        </form>
        
        <div class="mt-4">
            <a href="/{{ company.slug }}" style="color: #666; text-decoration: none; font-size: 0.8rem;">العودة لصفحة الحجز</a>
        </div>
    </div>
</body>
</html>
