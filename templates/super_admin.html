<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة السوبر أدمن | إدارة المنصة 🚀</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 30px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a237e; border-bottom: 2px solid #1a237e; padding-bottom: 10px; margin-top: 30px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button.btn-main { background: #1a237e; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button.btn-main:hover { background: #283593; }
        
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #fff; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #1a237e; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .active { background: #e8f5e9; color: #2e7d32; }
        .inactive { background: #ffebee; color: #c62828; }
        
        .toggle-btn { border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.8rem; transition: 0.3s; }
        .block-btn { background: #ff5252; color: white; }
        .activate-btn { background: #4caf50; color: white; }
        .link { color: #1a237e; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #1a237e;">التحكم المركزي للمنصة 🛠️</h1>
        
        <h2>➕ إضافة شركة جديدة</h2>
        <form method="POST">
            <div class="form-group"><input type="text" name="name" placeholder="اسم الشركة (مثلاً: شركة النخبة)" required></div>
            <div class="form-group"><input type="text" name="slug" placeholder="رابط الشركة (Slug) بالإنجليزية" required></div>
            <div class="form-group"><input type="password" name="password" placeholder="كلمة مرور المدير" required></div>
            <button type="submit" class="btn-main">تسجيل وتفعيل الشركة الآن</button>
        </form>

        <h2>🏢 الشركات وإدارة الاشتراكات</h2>
        <table>
            <thead>
                <tr>
                    <th>الشركة</th>
                    <th>رابط الحجز</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody>
                {% for co in companies %}
                <tr>
                    <td>
                        <strong>{{ co.name }}</strong><br>
                        <small><code>{{ co.slug }}</code></small>
                    </td>
                    <td><a href="/{{ co.slug }}" class="link" target="_blank">معاينة 🔗</a></td>
                    <td>
                        {% if co.is_active %}
                            <span class="status-badge active">نشط ✅</span>
                        {% else %}
                            <span class="status-badge inactive">محجوب ❌</span>
                        {% endif %}
                    </td>
                    <td>
                        <form action="/toggle_status/{{ co.id }}" method="POST" style="margin: 0;">
                            {% if co.is_active %}
                                <button type="submit" class="toggle-btn block-btn" onclick="return confirm('هل تريد حجب الخدمة عن {{ co.name }}؟')">🛑 حجب</button>
                            {% else %}
                                <button type="submit" class="toggle-btn activate-btn">🔓 تفعيل</button>
                            {% endif %}
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
